<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Why the reviewer "can't locate" your in-app purchases</text>

  <!-- divider -->
  <line x1="380" y1="56" x2="380" y2="452" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ===== LEFT: the failed path ===== -->
  <text x="190" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Rejected &#215;3</text>

  <rect x="60" y="90" width="260" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="13" fill="#7f1d1d">Reviewer opens the app</text>
  <line x1="190" y1="136" x2="190" y2="164" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="60" y="166" width="260" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="194" text-anchor="middle" font-size="13" fill="#7f1d1d">Hits the login wall</text>
  <line x1="190" y1="212" x2="190" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="60" y="242" width="260" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="266" text-anchor="middle" font-size="13" fill="#7f1d1d">OTP is texted to YOUR phone</text>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#b91c1c">reviewer can't receive it</text>
  <line x1="190" y1="294" x2="190" y2="322" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="60" y="324" width="260" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="352" text-anchor="middle" font-size="13" fill="#7f1d1d">Never reaches the paywall</text>
  <line x1="190" y1="370" x2="190" y2="398" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="60" y="400" width="260" height="46" rx="8" fill="#dc2626"/>
  <text x="190" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">"Can't locate in-app purchases"</text>

  <!-- ===== RIGHT: the fixed path ===== -->
  <text x="570" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Approved</text>

  <rect x="440" y="90" width="260" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="118" text-anchor="middle" font-size="13" fill="#14532d">Dedicated demo account, 2FA off</text>
  <line x1="570" y1="136" x2="570" y2="164" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="440" y="166" width="260" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="194" text-anchor="middle" font-size="13" fill="#14532d">Signs in with no OTP needed</text>
  <line x1="570" y1="212" x2="570" y2="240" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="440" y="242" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="266" text-anchor="middle" font-size="13" fill="#14532d">Step-by-step notes + recording</text>
  <text x="570" y="284" text-anchor="middle" font-size="11" fill="#15803d">exact path to the buy button</text>
  <line x1="570" y1="294" x2="570" y2="322" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="440" y="324" width="260" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="348" text-anchor="middle" font-size="13" fill="#14532d">Reaches paywall; IAPs load</text>
  <text x="570" y="364" text-anchor="middle" font-size="10.5" fill="#15803d">products attached to the version</text>
  <line x1="570" y1="370" x2="570" y2="398" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="440" y="400" width="260" height="46" rx="8" fill="#16a34a"/>
  <text x="570" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Approved on submission #4</text>
</svg>
